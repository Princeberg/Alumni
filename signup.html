<script>
 
  const togglePassword = document.querySelector('#togglePassword');
  const password = document.querySelector('#password');

  if (togglePassword && password) {
    togglePassword.addEventListener('click', function () {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      this.classList.toggle('fa-eye');
      this.classList.toggle('fa-eye-slash');
    });
  }

  const step1 = document.getElementById('step1');
  const step2 = document.getElementById('step2');
  const step3 = document.getElementById('step3');

  const ind1 = document.getElementById('step1-indicator');
  const ind2 = document.getElementById('step2-indicator');
  const ind3 = document.getElementById('step3-indicator');

  document.getElementById('next-to-step2').addEventListener('click', () => {
    step1.style.display = 'none';
    step2.style.display = 'block';
    ind1.classList.remove('active');
    ind2.classList.add('active');
  });

  document.getElementById('prev-to-step1').addEventListener('click', () => {
    step2.style.display = 'none';
    step1.style.display = 'block';
    ind2.classList.remove('active');
    ind1.classList.add('active');
  });

  document.getElementById('next-to-step3').addEventListener('click', () => {
    step2.style.display = 'none';
    step3.style.display = 'block';
    ind2.classList.remove('active');
    ind3.classList.add('active');
  });

  document.getElementById('prev-to-step2').addEventListener('click', () => {
    step3.style.display = 'none';
    step2.style.display = 'block';
    ind3.classList.remove('active');
    ind2.classList.add('active');
  });


  const whatsappInput = document.getElementById('whatsapp');

whatsappInput.addEventListener('input', (e) => {
  let val = e.target.value;

  // Force le "+" au début si l'utilisateur tente de le supprimer
  if (!val.startsWith('+')) {
    val = '+' + val;
  }

  // Extrait uniquement les chiffres après le "+"
  const numbersOnly = val.slice(1).replace(/\D/g, '');

  // Recompose la valeur avec le "+" fixe suivi uniquement des chiffres
  e.target.value = '+' + numbersOnly;
});

// Empêche de placer le curseur avant le signe "+"
whatsappInput.addEventListener('keydown', (e) => {
  if ((e.key === 'Backspace' || e.key === 'Delete') && whatsappInput.selectionStart <= 1 && whatsappInput.selectionEnd <= 1) {
    e.preventDefault();
  }
});
</script>
